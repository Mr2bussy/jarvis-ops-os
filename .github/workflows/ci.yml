name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Runs before install on purpose: the scanner is dependency-free, so a leaked
      # credential fails the build in seconds instead of after a full toolchain setup.
      - name: Secret scan (full tree, fail on new)
        run: node scripts/scan-secrets.mjs --all --fail-on-new

      - name: Doctor (tree hygiene)
        run: node scripts/doctor.mjs --tree

      - name: Doctor self-test (exit-code fixtures)
        run: node scripts/doctor.mjs --self-test

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit gate (high/critical or documented exceptions)
        run: node scripts/audit-gate.mjs

      # The remaining warnings are knowingly tolerated: eslint.config.mjs grades
      # legacy/stylistic noise as `warn` and correctness bugs as `error`. Dropping the
      # `|| true` therefore makes every ESLint *error* blocking from now on, while the
      # high --max-warnings cap keeps the warning backlog from failing the build.
      - name: Lint (errors block, legacy warnings tolerated)
        run: pnpm exec eslint . --max-warnings=9999

      - name: Typecheck (renderer)
        run: pnpm exec tsc -p tsconfig.json

      - name: Typecheck (electron)
        run: pnpm exec tsc -p electron/tsconfig.json --noEmit

      # Optional gates: skip when scripts are not yet on the branch (verify.mjs does the same).
      - name: IPC registry drift check
        run: |
          if (Test-Path scripts/gen-ipc.mjs) { pnpm gen:ipc --check } else { Write-Host "SKIP gen:ipc (missing script)" }

      - name: Dependency boundaries (depcruise)
        run: |
          if (Test-Path .dependency-cruiser.cjs) { pnpm depcruise } else { Write-Host "SKIP depcruise (missing config)" }

      - name: File size budget
        run: |
          if (Test-Path scripts/check-file-size.mjs) { pnpm check:size } else { Write-Host "SKIP check:size (missing script)" }

      - name: Security suite (allowlist + threat + csp + fuzz)
        run: pnpm test:security

      - name: Unit tests + coverage
        run: pnpm test:cov

      - name: Coverage ratchet
        run: node scripts/coverage-ratchet.mjs

      - name: Production build
        run: pnpm build

      - name: Electron security scan (non-blocking; promote to blocking once triaged)
        run: pnpm exec electronegativity -i . || true

  # D3 flaky-gate: dedicated job runs the unit suite 3×; any failure fails verify.
  flaky:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Unit tests ×3 (flaky gate)
        run: pnpm test:flaky

  python-bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: pip install -r mt5_bridge/requirements-dev.txt
      - name: Pytest
        run: python -m pytest mt5_bridge -q

  # Named status check for branch protection (docs/BRANCH-PROTECTION.md).
  # Aggregates quality + flaky + python-bridge so only one context must be required.
  # enforce_admins stays false when Zac applies the rule — see BRANCH-PROTECTION.md.
  verify:
    name: verify
    runs-on: windows-latest
    needs: [quality, flaky, python-bridge]
    steps:
      - name: All required CI jobs passed
        run: echo "verify gate OK (quality + flaky + python-bridge)"

# release.yml (separate, on: tag) would run `electron-builder --win --publish always`
# with CSC_LINK / CSC_KEY_PASSWORD secrets for code signing - see PATH_TO_9.md.
